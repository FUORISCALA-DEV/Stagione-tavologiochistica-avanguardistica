name: Patch background audio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch audio visibility behavior
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          marker = '// AUDIO_BACKGROUND_VISIBILITY_GUARD'
          if marker in s:
              print('Audio visibility guard already present.')
              raise SystemExit(0)

          snippet = base64.b64decode('').decode('utf-8')
          needle = "  renderHistory();\n  renderAll();\n})();"
          if needle not in s:
              raise SystemExit('Patch target not found in js/app.js')

          p.write_text(s.replace(needle, snippet + needle, 1), encoding='utf-8')
          print('Background audio guard inserted.')
          PY

      - name: Syntax check
        run: node --check js/app.js

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Pause audio when app is not visible"
          git push
