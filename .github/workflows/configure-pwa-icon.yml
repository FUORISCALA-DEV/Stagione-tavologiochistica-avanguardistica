name: Configure PWA icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-pwa-icon.yml'

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure favicon and install icon
        shell: python
        run: |
          from pathlib import Path
          import shutil, json

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          old = '<title>Ruota Tavologiochistica</title>\n<link rel="stylesheet" href="css/app.css">'
          head_lines = [
              '<title>Stagione Tavologiochistica Avanguardistica</title>',
              '<meta name="theme-color" content="#0d1729">',
              '<meta name="application-name" content="Stagione Tavologiochistica Avanguardistica">',
              '<meta name="apple-mobile-web-app-capable" content="yes">',
              '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">',
              '<meta name="apple-mobile-web-app-title" content="Stagione Tavologiochistica">',
              '<link rel="icon" type="image/png" href="favicon.png">',
              '<link rel="apple-touch-icon" href="apple-touch-icon.png">',
              '<link rel="manifest" href="manifest.webmanifest">',
              '<link rel="stylesheet" href="css/app.css">',
          ]
          new = '\n'.join(head_lines)

          if old in html:
              html = html.replace(old, new, 1)
          elif 'rel="manifest" href="manifest.webmanifest"' not in html:
              raise SystemExit('Head structure not recognized; refusing to modify index.html')

          index.write_text(html, encoding='utf-8')

          icon = Path('assets/images/image_01.png')
          if not icon.exists():
              raise SystemExit('assets/images/image_01.png not found')

          shutil.copyfile(icon, 'favicon.png')
          shutil.copyfile(icon, 'apple-touch-icon.png')

          manifest = {
              'name': 'Stagione Tavologiochistica Avanguardistica',
              'short_name': 'Stagione Tavologiochistica',
              'description': 'Stagione Tavologiochistica Avanguardistica',
              'start_url': './',
              'scope': './',
              'display': 'standalone',
              'background_color': '#0d1729',
              'theme_color': '#0d1729',
              'icons': [
                  {
                      'src': 'assets/images/image_01.png',
                      'sizes': 'any',
                      'type': 'image/png',
                      'purpose': 'any'
                  }
              ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest favicon.png apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use image_01 as site and install icon"
          git push
